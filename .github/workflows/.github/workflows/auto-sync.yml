name: Auto Sync from Upstream

on:
  schedule:
    # This runs automatically every day at Midnight (UTC)
    - cron: '0 0 * * *'
  
  # This button lets you run the sync manually at any time!
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          
      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add Upstream and Sync
        run: |
          # 1. Add Akash's repo as the upstream source
          git remote add upstream https://github.com/Akash-Veerla/Demographic.git
          
          # 2. Fetch all of Akash's latest changes
          git fetch upstream main
          
          # 3. Merge Akash's updates into your code
          git merge upstream/main --no-edit || echo "Merge conflict! You'll need to resolve manually on your computer."
          
          # 4. Push the successfully synced code into your repo automatically!
          git push origin main
